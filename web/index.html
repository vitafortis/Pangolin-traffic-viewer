<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0706" />
    <title>Pangolin Traffic</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Before paint: the saved theme, else the system's. -->
    <script>
      try {
        var t = localStorage.getItem("ptv-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
